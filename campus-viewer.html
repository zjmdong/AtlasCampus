<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园3D实景导览 - Campus Explorer</title>
<style>
  /* === Reset & Base === */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0a0a0f;
    color: #ccc;
  }

  /* === Layout === */
  .app {
    display: flex;
    height: 100vh;
    width: 100vw;
  }
  .viewer {
    flex: 1;
    position: relative;
    min-width: 0;
  }
  .viewer iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* === Loading Overlay === */
  .loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0a0f;
    z-index: 10;
    transition: opacity 0.5s, visibility 0.5s;
    pointer-events: none;
  }
  .loading.hidden {
    opacity: 0;
    visibility: hidden;
  }
  .loading .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.08);
    border-top-color: #4fc3f7;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p {
    margin-top: 16px;
    font-size: 14px;
    color: #888;
  }

  /* === Info Badge (footer-like) === */
  .viewer-info {
    position: absolute;
    bottom: 20px; left: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    pointer-events: none;
  }
  .viewer-info .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4caf50;
    display: inline-block;
  }

  /* === Sidebar === */
  .sidebar {
    width: 320px;
    min-width: 320px;
    background: #111118;
    border-left: 1px solid rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }
  .sidebar-header {
    padding: 24px 20px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .sidebar-header h1 {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.5px;
  }
  .sidebar-header p {
    font-size: 13px;
    color: #666;
    margin-top: 4px;
  }

  /* Search */
  .search-box {
    padding: 12px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .search-box input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    color: #ccc;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input::placeholder { color: #555; }
  .search-box input:focus { border-color: #4fc3f7; }

  /* Nav */
  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .sidebar-nav::-webkit-scrollbar {
    width: 4px;
  }
  .sidebar-nav::-webkit-scrollbar-track {
    background: transparent;
  }
  .sidebar-nav::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
  }

  /* Groups & Items */
  .nav-group-label {
    padding: 12px 20px 6px;
    font-size: 11px;
    font-weight: 600;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    cursor: pointer;
    transition: background 0.15s;
    border-left: 3px solid transparent;
    position: relative;
  }
  .nav-item:hover {
    background: rgba(255,255,255,0.03);
  }
  .nav-item.active {
    background: rgba(79,195,247,0.08);
    border-left-color: #4fc3f7;
  }
  .nav-item.active .item-name {
    color: #fff;
  }
  .nav-item .item-icon {
    width: 28px; height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    background: rgba(255,255,255,0.04);
  }
  .nav-item.active .item-icon {
    background: rgba(79,195,247,0.15);
  }
  .nav-item .item-content {
    flex: 1;
    min-width: 0;
  }
  .nav-item .item-name {
    font-size: 14px;
    color: #999;
    transition: color 0.15s;
  }
  .nav-item .item-sub {
    font-size: 11px;
    color: #555;
    margin-top: 1px;
  }
  .nav-item .item-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(79,195,247,0.12);
    color: #4fc3f7;
    flex-shrink: 0;
  }
  .nav-item .item-badge.soon {
    background: rgba(255,255,255,0.04);
    color: #555;
  }
  .nav-item.indent {
    padding-left: 48px;
  }

  /* Footer / Bottom */
  .sidebar-footer {
    padding: 14px 20px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 11px;
    color: #444;
    text-align: center;
  }
  .sidebar-footer a {
    color: #4fc3f7;
    text-decoration: none;
  }

  /* === Responsive === */
  @media (max-width: 768px) {
    .sidebar {
      width: 260px;
      min-width: 260px;
    }
  }
  @media (max-width: 600px) {
    .app {
      flex-direction: column-reverse;
    }
    .sidebar {
      width: 100%;
      min-width: 0;
      height: 50vh;
      border-left: none;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .viewer {
      height: 50vh;
    }
  }
</style>
</head>
<body>

<div class="app">

  <!-- === Main Viewer === -->
  <div class="viewer" id="viewer">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p id="loadingText">正在加载校园全景…</p>
    </div>
    <iframe id="viewerFrame" src="https://playcanv.as/p/TuQPhyBv/" allow="accelerometer; camera; gyroscope; autoplay; fullscreen" allowfullscreen loading="lazy"></iframe>
    <div class="viewer-info">
      <span class="dot"></span>
      <span id="locationLabel">校园全景</span>
    </div>
  </div>

  <!-- === Sidebar === -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>🏫 校园 3D 实景</h1>
      <p>选择区域查看室内点云模型</p>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索区域…" autocomplete="off">
    </div>

    <nav class="sidebar-nav" id="nav">
      <!-- 校园全景 (default) -->
      <div class="nav-item active" data-url="https://playcanv.as/p/TuQPhyBv/" data-label="校园全景">
        <div class="item-icon">🌐</div>
        <div class="item-content">
          <div class="item-name">校园全景</div>
          <div class="item-sub">整体 3DGS 点云</div>
        </div>
        <span class="item-badge">全景</span>
      </div>

      <!-- 行政楼 -->
      <div class="nav-group-label">🏛️ 行政楼</div>

      <div class="nav-item" data-url="" data-label="行政楼 1楼">
        <div class="item-icon">1</div>
        <div class="item-content">
          <div class="item-name">1 楼 · 大厅</div>
        </div>
        <span class="item-badge soon">即将上线</span>
      </div>
      <div class="nav-item" data-url="" data-label="行政楼 2楼">
        <div class="item-icon">2</div>
        <div class="item-content">
          <div class="item-name">2 楼 · 办公区</div>
        </div>
        <span class="item-badge soon">即将上线</span>
      </div>
      <div class="nav-item" data-url="" data-label="行政楼 3楼">
        <div class="item-icon">3</div>
        <div class="item-content">
          <div class="item-name">3 楼 · 会议室</div>
        </div>
        <span class="item-badge soon">即将上线</span>
      </div>
      <div class="nav-item" data-url="https://lcc-viewer.xgrids.cloud/pub/dbdfcu-suisqp_xz4" data-label="行政楼 4楼 · 艺术沙龙">
        <div class="item-icon">🎨</div>
        <div class="item-content">
          <div class="item-name">4 楼 · 艺术沙龙</div>
          <div class="item-sub">室内点云模型</div>
        </div>
        <span class="item-badge">已上线</span>
      </div>
      <div class="nav-item" data-url="" data-label="行政楼 5楼">
        <div class="item-icon">5</div>
        <div class="item-content">
          <div class="item-name">5 楼 · 活动室</div>
        </div>
        <span class="item-badge soon">即将上线</span>
      </div>

      <!-- 食堂 -->
      <div class="nav-group-label">🍽️ 食堂</div>

      <div class="nav-item" data-url="https://lcc-viewer.xgrids.cloud/pub/dbdfcu-suisqp_st" data-label="食堂 · 室内">
        <div class="item-icon">🍜</div>
        <div class="item-content">
          <div class="item-name">食堂 · 室内</div>
          <div class="item-sub">室内点云模型</div>
        </div>
        <span class="item-badge">已上线</span>
      </div>

      <!-- 更多区域 -->
      <div class="nav-group-label">📐 更多区域（规划中）</div>

      <div class="nav-item" data-url="" data-label="教学楼">
        <div class="item-icon">📚</div>
        <div class="item-content">
          <div class="item-name">教学楼</div>
        </div>
        <span class="item-badge soon">即将上线</span>
      </div>
      <div class="nav-item" data-url="" data-label="图书馆">
        <div class="item-icon">📖</div>
        <div class="item-content">
          <div class="item-name">图书馆</div>
        </div>
        <span class="item-badge soon">即将上线</span>
      </div>
      <div class="nav-item" data-url="" data-label="体育馆">
        <div class="item-icon">🏀</div>
        <div class="item-content">
          <div class="item-name">体育馆</div>
        </div>
        <span class="item-badge soon">即将上线</span>
      </div>
    </nav>

    <div class="sidebar-footer">
      其域实景 · <a href="https://lcc-viewer.xgrids.cloud" target="_blank">LCC Viewer</a> 驱动
    </div>
  </aside>
</div>

<script>
(function() {
  const frame    = document.getElementById('viewerFrame');
  const loading  = document.getElementById('loading');
  const loadText = document.getElementById('loadingText');
  const label    = document.getElementById('locationLabel');
  const items    = document.querySelectorAll('.nav-item');
  const search   = document.getElementById('searchInput');
  const nav      = document.getElementById('nav');

  // --- Navigation ---
  function activateItem(el) {
    // update active state
    items.forEach(i => i.classList.remove('active'));
    el.classList.add('active');

    const url   = el.dataset.url;
    const labelText = el.dataset.label || el.querySelector('.item-name')?.textContent || '校园全景';

    if (url) {
      // show loading overlay
      loading.classList.remove('hidden');
      loadText.textContent = `正在加载 ${labelText}…`;
      label.textContent = labelText;

      // switch iframe src
      frame.src = url;
    } else {
      // placeholder — just update label
      label.textContent = labelText + '（即将上线）';
    }
  }

  // Click on nav items
  items.forEach(item => {
    item.addEventListener('click', () => activateItem(item));
  });

  // --- Iframe load → hide loading ---
  frame.addEventListener('load', () => {
    loading.classList.add('hidden');
  });

  // fallback: hide loading after 8s even if iframe never fires load
  setTimeout(() => loading.classList.add('hidden'), 8000);

  // --- Search / Filter ---
  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    const allItems = nav.querySelectorAll('.nav-item');
    const groups  = nav.querySelectorAll('.nav-group-label');

    allItems.forEach(item => {
      const text = item.textContent.toLowerCase();
      if (!q || text.includes(q)) {
        item.style.display = 'flex';
      } else {
        item.style.display = 'none';
      }
    });

    // Hide group labels that have no visible items after them
    groups.forEach(g => {
      let sibling = g.nextElementSibling;
      let visible = false;
      while (sibling && sibling.classList.contains('nav-item')) {
        if (sibling.style.display !== 'none') { visible = true; break; }
        sibling = sibling.nextElementSibling;
      }
      g.style.display = visible ? 'block' : 'none';
    });
  });

})();
</script>
</body>
</html>
